[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-calculadora"
version = "0.1.0"
description = "Calculadora simples de linha de comandos."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
a-calculadora = "a_calculadora.cli:main"